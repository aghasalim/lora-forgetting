name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Scoring and data-generation tests only. They need no model, no GPU and
      # no network, so CI stays fast and reproducible for anyone.
      - run: pip install pytest
      - run: python -m pytest tests/ -q
